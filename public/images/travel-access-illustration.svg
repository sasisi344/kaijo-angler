<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">釣り場へのアクセス</title>
  <desc id="desc">車・新幹線・飛行機で海の釣り場へ向かうイラスト</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#sky)" />

  <!-- sun -->
  <circle cx="330" cy="70" r="34" fill="#fde68a" />

  <!-- airplane -->
  <g transform="translate(70,60) rotate(18)" fill="#0369a1">
    <path d="M0 6 L34 0 L46 6 L34 12 L0 6 Z" />
    <path d="M14 3 L14 -14 L20 -10 L20 3 Z" />
    <path d="M14 9 L14 22 L20 18 L20 9 Z" />
  </g>
  <g stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M4 46 h22" />
    <path d="M0 54 h16" />
  </g>

  <!-- sea -->
  <rect x="0" y="230" width="400" height="170" fill="url(#sea)" />
  <path d="M0 230 Q50 220 100 230 T200 230 T300 230 T400 230 V400 H0 Z" fill="#38bdf8" opacity="0.5" />

  <!-- pier -->
  <rect x="150" y="200" width="16" height="70" fill="#a16207" />
  <rect x="120" y="192" width="90" height="14" rx="3" fill="#b45309" />
  <rect x="120" y="192" width="90" height="4" fill="#d97706" />

  <!-- fishing rod + line -->
  <g stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M165 192 L235 130" />
    <path d="M235 130 Q245 190 225 245" stroke-width="1.5" stroke="#334155" />
  </g>
  <circle cx="225" cy="245" r="4" fill="#1e293b" />

  <!-- road -->
  <path d="M-20 400 C 60 320, 90 300, 150 270" fill="none" stroke="#475569" stroke-width="34" stroke-linecap="round" />
  <path d="M-20 400 C 60 320, 90 300, 150 270" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-dasharray="14 12" stroke-linecap="round" />

  <!-- car -->
  <g transform="translate(58,330)">
    <rect x="0" y="10" width="54" height="20" rx="6" fill="#0ea5e9" />
    <path d="M8 10 Q16 -6 34 -6 Q46 -6 48 10 Z" fill="#0ea5e9" />
    <rect x="14" y="-2" width="24" height="12" rx="2" fill="#e0f2fe" opacity="0.85" />
    <circle cx="12" cy="32" r="7" fill="#1e293b" />
    <circle cx="42" cy="32" r="7" fill="#1e293b" />
    <circle cx="12" cy="32" r="3" fill="#94a3b8" />
    <circle cx="42" cy="32" r="3" fill="#94a3b8" />
  </g>

  <!-- shinkansen -->
  <g transform="translate(240,300)">
    <path d="M0 24 Q4 0 34 0 L96 0 Q106 0 106 14 L106 24 Z" fill="#f8fafc" stroke="#0369a1" stroke-width="2" />
    <rect x="0" y="24" width="106" height="10" fill="#0369a1" />
    <rect x="14" y="6" width="18" height="10" rx="2" fill="#0ea5e9" />
    <rect x="38" y="6" width="18" height="10" rx="2" fill="#0ea5e9" />
    <rect x="62" y="6" width="18" height="10" rx="2" fill="#0ea5e9" />
    <rect x="86" y="6" width="14" height="10" rx="2" fill="#0ea5e9" />
    <circle cx="18" cy="38" r="5" fill="#1e293b" />
    <circle cx="88" cy="38" r="5" fill="#1e293b" />
  </g>
  <path d="M0 334 H400" stroke="#94a3b8" stroke-width="3" />
</svg>
